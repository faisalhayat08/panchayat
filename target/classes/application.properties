spring.application.name=Digital Panchayat

# ---------------------------------------------------------------
# DATABASE
# By default we use H2 in-memory DB so the project runs instantly
# with zero setup (perfect for a college demo/evaluation).
# To use real MySQL for production, comment the H2 block and
# uncomment the MySQL block below.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:panchayatdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL (production) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/panchayat_db?createDatabaseIfNotExist=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------------------------------------------------------------
# FILE UPLOAD (voice recordings)
# ---------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
app.upload.voice-dir=uploads/voice-complaints

# ---------------------------------------------------------------
# MAIL (Admin Inbox notifications)
# Fill these with real SMTP creds to send real emails.
# If left blank, the app safely falls back to storing the
# notification in the in-app Admin Inbox only (no crash).
# ---------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.admin.inbox-email=admin@panchayat.local
# Secret master passcode for Main Management Head instant self-approval
app.admin.master-code=PANCHAYAT2026

# ---------------------------------------------------------------
# AI SERVICES (Voice-to-Text / Translation)
# This project ships with a working rule-based mock implementation
# (VoiceTranscriptionServiceImpl / TranslationServiceImpl) so it
# runs completely offline for evaluation.
# To use real AI, plug your API key here and switch the
# implementation used in AiConfig (see README.md).
# ---------------------------------------------------------------
app.ai.provider=mock
app.ai.api-key=

server.port=8080
